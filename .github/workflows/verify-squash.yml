name: Verify squashed Nix identity
on:
  push:
    branches: [work/verify-squashed-fork-2026-09-08]
permissions:
  contents: read
jobs:
  verify-derivations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Verify identical source and Nix derivations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/squash-identity"
          git diff --exit-code 16e5e6020a7049eaae049d8a568d0ff649e428bf 9d4253da60b479c8bdc01b43d255b415dbd0bd09
          git checkout --detach 16e5e6020a7049eaae049d8a568d0ff649e428bf
          for platform in x86_64-linux aarch64-linux; do
            nix eval --raw ".#packages.$platform.handy.drvPath" > "$RUNNER_TEMP/squash-identity/candidate-$platform.txt"
          done
          git checkout --detach 9d4253da60b479c8bdc01b43d255b415dbd0bd09
          test "$(git rev-parse HEAD^)" = 330b2ddbed3daab8f1fb09385cc1aaf73708e9d7
          test "$(git rev-list --count HEAD^..HEAD)" = 1
          test "$(git rev-parse 'HEAD^{tree}')" = db2c7aa2f5b1e4616e67b010936479b5e6b3553b
          for platform in x86_64-linux aarch64-linux; do
            nix eval --raw ".#packages.$platform.handy.drvPath" > "$RUNNER_TEMP/squash-identity/squashed-$platform.txt"
            diff -u "$RUNNER_TEMP/squash-identity/candidate-$platform.txt" "$RUNNER_TEMP/squash-identity/squashed-$platform.txt"
            printf '\n%s: identical derivation\n' "$platform"
            cat "$RUNNER_TEMP/squash-identity/squashed-$platform.txt"
          done
          test "$(cat "$RUNNER_TEMP/squash-identity/squashed-x86_64-linux.txt")" = /nix/store/h5r1l7xysn1iqh5g7642hhkf7cf41bwg-handy-0.9.6.drv
          git diff --exit-code
          git show -s --format='%H%n%T%n%P%n%s' HEAD > "$RUNNER_TEMP/squash-identity/validated-commit.txt"
          echo 'Source trees and both Linux Nix derivations are identical.' | tee "$RUNNER_TEMP/squash-identity/result.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: squash-nix-identity
          path: ${{ runner.temp }}/squash-identity/
          retention-days: 7
