name: "Temporary Handy combined-tree preparation"
on:
  push:
    branches: [work/handy-sync-rebase-helper-2026-11-02]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Apply existing fork delta on top of latest upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Handy Sync Bot"
          git config user.email "handy-sync@users.noreply.github.com"
          git fetch https://github.com/cjpais/Handy.git main
          git cat-file -e b99b9af2c40c9765d496c2db68b4fecf8749e66b^{commit}
          git checkout --detach b99b9af2c40c9765d496c2db68b4fecf8749e66b
          git -c merge.conflictStyle=zdiff3 cherry-pick -X theirs --no-commit df04360560e5a8ec27c5505e3549fb5fa933b747
          # Upstream replaced legacy 'sonner' toasts with the notices framework.
          # Reapply only the fork's OS notification feature on the new typed event.
          git show HEAD:src/App.tsx > src/App.tsx
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src/App.tsx")
          t=p.read_text()
          old='import { platform } from "@tauri-apps/plugin-os";'
          assert t.count(old)==1
          t=t.replace(old,'''import {
            isPermissionGranted,
            requestPermission,
            sendNotification,
          } from "@tauri-apps/plugin-notification";
          '''.replace('          ', '')+old)
          old='import { commands } from "@/bindings";'
          assert t.count(old)==1
          t=t.replace(old,'import { commands, events } from "@/bindings";')
          old='function App() {'
          assert t.count(old)==1
          helper='''const showTranscriptionErrorNotification = async (title: string, body: string) => {
            try {
              let allowed = await isPermissionGranted();
              if (!allowed) allowed = (await requestPermission()) === "granted";
              if (allowed) sendNotification({ title, body });
            } catch (error) {
              console.warn("Failed to show transcription error notification:", error);
            }
          };

          '''
          t=t.replace(old,helper+old)
          old='  const revealMainWindowForPermissions = async () => {'
          assert t.count(old)==1
          listener='''  // Preserve the fork's native notification on transcription failure.
            // Upstream now publishes errors via notices, not "transcription-error".
            useEffect(() => {
              const unlisten = events.noticesChanged.listen(({ payload: { raised } }) => {
                if (raised?.source === "dictation" && raised.code === "TranscriptionFailed") {
                  void showTranscriptionErrorNotification(
                    t("errors.transcriptionFailedTitle"),
                    raised.detail ?? "",
                  );
                }
              });
              return () => {
                void unlisten.then((fn) => fn());
              };
            }, [t]);

          '''
          t=t.replace(old,listener+old)
          p.write_text(t)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("src-tauri/src/actions.rs")
          s=p.read_text()
          def replace(old, new):
              global s
              count=s.count(old)
              if count != 1:
                  raise RuntimeError(f"expected unique patch point, got {count}: {old[:110]!r}")
              s=s.replace(old,new)
          # A recording that fails to stop should also enter the new persistent notices UI.
          replace('let _ = ah.emit("transcription-error", format!("Recording stop failed: {e}"));',
          '''notices::raise(
                                  &ah,
                                  Notice::new(NoticeCode::RecordingFailed, NoticeSource::Dictation)
                                      .with_detail(format!("Recording stop failed: {e}")),
                              );
                              let _ = ah.emit("transcription-error", format!("Recording stop failed: {e}"));''')
          replace('''let _ = ah.emit(
                                  "transcription-error",
                                  format!("Failed to save recording: {e}"),
                              );''',
          '''notices::raise(
                                  &ah,
                                  Notice::new(NoticeCode::TranscriptionFailed, NoticeSource::Dictation)
                                      .with_detail(format!("Failed to save recording: {e}")),
                              );
                              let _ = ah.emit(
                                  "transcription-error",
                                  format!("Failed to save recording: {e}"),
                              );''')
          replace('''let _ = ah.emit(
                                  "transcription-error",
                                  format!("Failed to save recording to History: {e}"),
                              );''',
          '''notices::raise(
                                  &ah,
                                  Notice::new(NoticeCode::TranscriptionFailed, NoticeSource::Dictation)
                                      .with_detail(format!("Failed to save recording to History: {e}")),
                              );
                              let _ = ah.emit(
                                  "transcription-error",
                                  format!("Failed to save recording to History: {e}"),
                              );''')
          replace('''let _ = ah.emit("transcription-error", e);''',
          '''notices::raise(
                                      &ah,
                                      Notice::new(NoticeCode::TranscriptionFailed, NoticeSource::Dictation)
                                          .with_detail(e.to_string()),
                                  );
                                  let _ = ah.emit("transcription-error", e);''')
          replace('''let paste_app = ah.clone();
                      if let Err(e)''',
          '''let paste_app = ah.clone();
                      let post_process_failed = processed.post_process_failed;
                      let session = RECORDING_SESSION.load(Ordering::SeqCst);
                      if let Err(e)''')
          replace('''Ok(()) => TranscriptionOutcome::Typed,
                              Err(e) => {
                                  error!("Failed to paste transcription: {e}");
                                  let _ = paste_app.emit("paste-error", ());
                                  TranscriptionOutcome::Failed
                              }''',
          '''Ok(()) => {
                                  // A later recording must not lose its own error notice.
                                  if RECORDING_SESSION.load(Ordering::SeqCst) == session {
                                      notices::clear(&paste_app, NoticeSource::Dictation);
                                      if post_process_failed {
                                          notices::raise(
                                              &paste_app,
                                              Notice::new(
                                                  NoticeCode::PostProcessFailed,
                                                  NoticeSource::Dictation,
                                              ),
                                          );
                                      }
                                  }
                                  TranscriptionOutcome::Typed
                              }
                              Err(e) => {
                                  error!("Failed to paste transcription: {e}");
                                  let notice = Notice::new(NoticeCode::PasteFailed, NoticeSource::Dictation)
                                      .with_detail(e.to_string());
                                  if RECORDING_SESSION.load(Ordering::SeqCst) == session {
                                      notices::raise(&paste_app, notice);
                                  } else {
                                      notices::raise_without_overlay(&paste_app, notice);
                                  }
                                  let _ = paste_app.emit("paste-error", ());
                                  TranscriptionOutcome::Failed
                              }''')
          replace('''error!("Failed to schedule transcription paste: {e}");
                          let _ = ah.emit("paste-error", ());''',
          '''error!("Failed to schedule transcription paste: {e}");
                          notices::raise(
                              &ah,
                              Notice::new(NoticeCode::PasteFailed, NoticeSource::Dictation)
                                  .with_detail(e.to_string()),
                          );
                          let _ = ah.emit("paste-error", ());''')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path)
              s=p.read_text()
              if s.count(old)!=1:
                  raise RuntimeError(f"unique patch expected in {path}, found {s.count(old)}: {old[:100]}")
              p.write_text(s.replace(old,new))
          a="src-tauri/src/actions.rs"
          patch(a, 'use tauri::{AppHandle, Manager};', 'use tauri::{AppHandle, Emitter, Manager};')
          patch(a, 'async fn post_process_transcription(settings: &AppSettings, transcription: &str) -> Option<String> {', '''/// What became of a transcription's post-processing.
          #[derive(Debug, PartialEq, Eq)]
          enum PostProcessOutcome {
              Skipped,
              Done(String),
              Failed,
          }
          
          async fn post_process_transcription(
              settings: &AppSettings,
              transcription: &str,
          ) -> PostProcessOutcome {''')
          t="src-tauri/src/managers/transcription.rs"
          patch(t, 'use crate::managers::model::{ModelManager, CODEX_LOCAL_MODEL_ID};',
          '''use crate::managers::model::{ModelManager, CODEX_LOCAL_MODEL_ID};
          use crate::notices::{self, Notice, NoticeCode, NoticeSource};
          use crate::overlay;''')
          patch(t, 'pub fn initiate_model_load(&self) {', 'pub fn initiate_model_load(&self, raise_notice: bool) -> bool {')
          patch(t, '''if !reload_pending
                      && cached_model_matches(
                          is_loaded,
                          current_model.as_deref(),
                          &settings.selected_model,
                      )
                  {
                      return;
                  }''',
          '''if !reload_pending
                      && cached_model_matches(
                          is_loaded,
                          current_model.as_deref(),
                          &settings.selected_model,
                      )
                  {
                      return false;
                  }''')
          job="src-tauri/src/managers/transcription/job.rs"
          patch(job,'self.initiate_model_load(false);','self.initiate_model_load(false);') if False else None
          # The job should not raise a dictation-specific model load notice.
          # It already calls the new bool overload with false after cherry-pick.
          j=Path(job).read_text()
          assert 'self.initiate_model_load(false)' in j
          j="src-tauri/src/managers/transcription_jobs.rs"
          s=Path(j).read_text()
          assert s.count('return Ok(());')==2
          Path(j).write_text(s.replace('return Ok(());','return Ok(JobEnd::Cancelled);'))
          PY
          bunx bun2nix@2.1.2 -o .nix/bun.nix
          sha256sum bun.lock | cut -d' ' -f1 > .nix/bun-lock-hash
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun run check:translations
          bun run check:model-languages
          bun run format
          sed -i 's/[[:blank:]]*$//' src/bindings.ts
          git add -A
          git diff --cached --check
          git commit -m "feat: preserve Codex and Claude dictation atop Handy upstream b99b9af2" -m "Reapply the verified cloud STT fork delta to latest upstream, preserve native transcription notifications with the new notices framework, and retain a single fork commit."
          echo "Parent and candidate SHA:"
          git log -2 --format='%H %s'
          git status --porcelain
          git push origin HEAD:refs/heads/work/handy-sync-candidate-v4-2026-11-02
