name: "Handy upstream sync candidate (temporary)"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase the single fork commit onto the exact upstream HEAD
        env:
          SOURCE_SHA: 56a126e42ea0a6b4362f6741c62afc36aa25140f
          UPSTREAM_SHA: 7bfb2e2c934b798bcf6e3627653aed2439996f89
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Handy sync automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/cjpais/Handy.git
          git fetch --no-tags upstream main
          test "$(git rev-parse upstream/main)" = "$UPSTREAM_SHA"
          test "$(git rev-parse "$SOURCE_SHA^")" = 7b2a28a30aa24174292ddd7f4e92e12e6e3bd501
          git switch --detach "$UPSTREAM_SHA"
          if ! git cherry-pick -X theirs "$SOURCE_SHA"; then
            echo "Cherry-pick stopped. Inspecting conflicts."
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" = "src/components/onboarding/ModelCard.tsx" ]; then
              # The old onboarding ModelCard was removed by upstream's entirely new onboarding.
              # Its fork-specific model treatment needs a review in the new onboarding code.
              git rm -- src/components/onboarding/ModelCard.tsx
              GIT_EDITOR=true git cherry-pick --continue
            else
              echo "::error::Unresolved upstream/fork conflicts:"
              printf '%s\\n' "$conflicts"
              git status --short
              exit 1
            fi
          fi
          test "$(git rev-parse HEAD^)" = "$UPSTREAM_SHA"
          # Generated type bindings have whitespace-only drift after the rebase.
          # Keep their existing content but remove trailing whitespace in the candidate.
          python3 -c 'from pathlib import Path; p=Path("src/bindings.ts"); s=p.read_text(); p.write_text("\n".join(x.rstrip(" \t") for x in s.split("\n")))' 
          if ! git diff --quiet; then
            git add src/bindings.ts
            git commit --amend --no-edit
          fi
          git diff --check HEAD^ HEAD
          echo "Candidate SHA: $(git rev-parse HEAD)"
          echo "Changed files:"
          git diff --stat HEAD^ HEAD | tail -n 100
          # GITHUB_TOKEN cannot update workflow files. Keep the preliminary
          # candidate's workflow paths identical to upstream; a separate,
          # owner-authorized GitHub connector write will restore the two fork
          # regression workflows in a single commit with the same parent.
          git restore --source="$UPSTREAM_SHA" --staged --worktree -- .github/workflows/nix-check.yml
          git rm -- .github/workflows/fork-regressions.yml
          git commit --amend --no-edit
          test -z "$(git diff --name-only "$UPSTREAM_SHA" HEAD -- .github/workflows)"
          echo "Intermediate candidate SHA: $(git rev-parse HEAD)"
          echo "Pushing intermediate candidate branch for review only (NOT main)"
          git push origin HEAD:refs/heads/work/handy-sync-candidate-2026-10-30
