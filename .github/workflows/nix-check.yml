# Evaluate the Linux packages and build the actual x86_64 package.
# Flake evaluation alone does not compile Rust or validate native dependencies.
name: "nix build check"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "bun.lock"
      - "package.json"
      - "scripts/check-nix-deps.ts"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "bun.lock"
      - "package.json"
      - "scripts/check-nix-deps.ts"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: handy-computer
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Check generated Nix dependencies
        run: |
          bunx bun2nix@2.1.2 -o .nix/bun.nix
          git diff --exit-code -- .nix/bun.nix
          test "$(sha256sum bun.lock | cut -d' ' -f1)" = "$(cat .nix/bun-lock-hash)"
      - name: Evaluate both Linux packages
        run: |
          nix eval --raw .#packages.x86_64-linux.handy.drvPath
          nix eval --raw .#packages.aarch64-linux.handy.drvPath
      - name: Build and smoke-test Handy
        shell: bash
        run: |
          set -euo pipefail
          nix build .#handy -L --show-trace 2>&1 | tee "$RUNNER_TEMP/handy-nix-build.log"
          test -x result/bin/handy
          result/bin/handy --help
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log
          path: ${{ runner.temp }}/handy-nix-build.log
          if-no-files-found: ignore
          retention-days: 7
