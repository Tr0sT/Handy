# Evaluate the Linux packages and build the actual x86_64 package.
# Flake evaluation alone does not compile Rust or validate native dependencies.
name: "nix build check"
on:
  workflow_dispatch:
  push:
    branches: [main, "work/handy-sync-*"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "bun.lock"
      - "package.json"
      - "scripts/check-nix-deps.ts"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - ".nix/**"
      - "bun.lock"
      - "package.json"
      - "scripts/check-nix-deps.ts"
      - "src-tauri/**"
      - "src/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    name: nix build (${{ matrix.nixpkgs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Consumers can follow a newer nixpkgs than Handy's own lock file.
        nixpkgs: [locked, nixpkgs-unstable]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: handy-computer
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Check generated Nix dependencies
        run: |
          bunx bun2nix@2.1.2 -o .nix/bun.nix
          git diff --exit-code -- .nix/bun.nix
          test "$(sha256sum bun.lock | cut -d' ' -f1)" = "$(cat .nix/bun-lock-hash)"
      - name: Select nixpkgs revision
        shell: bash
        env:
          NIXPKGS_CHANNEL: ${{ matrix.nixpkgs }}
        run: |
          set -euo pipefail
          nix_args=(--no-write-lock-file)
          if [[ "$NIXPKGS_CHANNEL" == "locked" ]]; then
            nixpkgs_rev=$(jq -er '.nodes.nixpkgs.locked.rev' flake.lock)
          else
            # Resolve once so evaluation and build use the same revision.
            nixpkgs_rev=$(nix flake metadata --json "github:NixOS/nixpkgs/$NIXPKGS_CHANNEL" | jq -er '.locked.rev')
            nix_args+=(--override-input nixpkgs "github:NixOS/nixpkgs/$nixpkgs_rev")
          fi
          printf '%s\n' "${nix_args[@]}" > "$RUNNER_TEMP/handy-nix-args"
          printf 'nixpkgs (%s): %s\n' "$NIXPKGS_CHANNEL" "$nixpkgs_rev" | tee "$RUNNER_TEMP/handy-nix-build.log"
      - name: Evaluate both Linux packages
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nix_args < "$RUNNER_TEMP/handy-nix-args"
          nix eval "${nix_args[@]}" --raw .#packages.x86_64-linux.handy.drvPath
          nix eval "${nix_args[@]}" --raw .#packages.aarch64-linux.handy.drvPath
      - name: Build and smoke-test Handy
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nix_args < "$RUNNER_TEMP/handy-nix-args"
          nix build "${nix_args[@]}" .#handy -L --show-trace 2>&1 | tee -a "$RUNNER_TEMP/handy-nix-build.log"
          test -x result/bin/handy
          result/bin/handy --help
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log-${{ matrix.nixpkgs }}
          path: ${{ runner.temp }}/handy-nix-build.log
          if-no-files-found: ignore
          retention-days: 7
