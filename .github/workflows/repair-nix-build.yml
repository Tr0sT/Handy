name: Validate Nix repair candidate
on:
  push:
    branches: [work/nix-build-repair-2026-09-08]
permissions:
  contents: write
  actions: read
concurrency:
  group: handy-nix-repair-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Inspect the merged source and original failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nix-repair"
          git checkout --detach dbfd7ffd1881bc2f0e3cc4556ff9293f31e19f3d
          test "$(git rev-parse HEAD^2)" = 330b2ddbed3daab8f1fb09385cc1aaf73708e9d7
          git log --format='%h %s' 330b2ddbed3daab8f1fb09385cc1aaf73708e9d7..HEAD | tee "$RUNNER_TEMP/nix-repair/fork-commits.txt"
          git diff --stat 66652ba2b2f403186802e4a9415e861366630a9e HEAD | tee "$RUNNER_TEMP/nix-repair/merged-changes.txt"
          gh run view 34212699308 --repo Tr0sT/Handy --log > "$RUNNER_TEMP/nix-repair/original-nix.log"
          grep -E 'error:|error\[|403|rustc-[0-9]|cargo-[0-9]' "$RUNNER_TEMP/nix-repair/original-nix.log" | tail -35 || true
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: handy-computer
          skipPush: true
      - name: Update only the Nixpkgs lock and publish the candidate branch
        run: |
          set -euo pipefail
          nix flake update nixpkgs 2>&1 | tee "$RUNNER_TEMP/nix-repair/update.log"
          git diff --check
          git config user.name 'Sergey Morozov'
          git config user.email 'tr0st@bk.ru'
          git add flake.lock
          git commit -m 'fix(nix): refresh the locked build environment and crate fetchers'
          git push origin HEAD:refs/heads/work/nix-updated-candidate-2026-09-08
          git rev-parse HEAD | tee "$RUNNER_TEMP/nix-repair/candidate-sha.txt"
          git branch candidate-export HEAD
          git bundle create "$RUNNER_TEMP/nix-repair/source.bundle" candidate-export
          cp flake.lock "$RUNNER_TEMP/nix-repair/flake.lock"
          nix eval --raw .#packages.x86_64-linux.handy.drvPath | tee "$RUNNER_TEMP/nix-repair/derivation.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-repair-source
          path: ${{ runner.temp }}/nix-repair/
          retention-days: 3
      - name: Build the actual Nix package
        run: |
          set -euo pipefail
          nix build .#handy -L --show-trace > "$RUNNER_TEMP/nix-repair/build.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 20
            tail -5 "$RUNNER_TEMP/nix-repair/build.log"
          done
          status=0
          wait "$pid" || status=$?
          tail -100 "$RUNNER_TEMP/nix-repair/build.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -x result/bin/handy
          readlink -f result | tee "$RUNNER_TEMP/nix-repair/result.txt"
          result/bin/handy --help > "$RUNNER_TEMP/nix-repair/help.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-repair-build-results
          path: ${{ runner.temp }}/nix-repair/
          retention-days: 3
