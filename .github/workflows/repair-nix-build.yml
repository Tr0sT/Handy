name: Validate Nix repair candidate
on:
  push:
    branches: [work/nix-build-repair-2026-09-08]
permissions:
  contents: write
  actions: read
concurrency:
  group: handy-nix-repair-candidate
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Prepare the compatible tool upgrade
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nix-repair"
          git checkout --detach e6ef7124b6365495438de818634fadfe05ce7f68
          python3 - <<'PY'
          from pathlib import Path
          p = Path('flake.nix')
          s = p.read_text()
          assert 'bun2nix/2.0.8' in s
          p.write_text(s.replace('bun2nix/2.0.8', 'bun2nix/2.1.2'))
          p = Path('scripts/check-nix-deps.ts')
          s = p.read_text().replace('bunx bun2nix', 'bunx bun2nix@2.1.2')
          s = s.replace('["bunx", "bun2nix",', '["bunx", "bun2nix@2.1.2",')
          p.write_text(s)
          p = Path('.github/workflows/nix-check.yml')
          s = p.read_text().replace('bunx bun2nix -o', 'bunx bun2nix@2.1.2 -o')
          s = s.replace('so compilation-breaking edits are caught by flake eval.', 'to catch Nix expression errors (Rust compilation requires a full build).')
          s = s.replace('      - "bun.lock"', '      - "bun.lock"\n      - "scripts/check-nix-deps.ts"')
          p.write_text(s)
          PY
      - uses: oven-sh/setup-bun@v2
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        with:
          name: handy-computer
          skipPush: true
      - name: Lock and publish the exact candidate
        run: |
          set -euo pipefail
          nix flake lock 2>&1 | tee "$RUNNER_TEMP/nix-repair/update.log"
          bunx bun2nix@2.1.2 --version
          bunx bun2nix@2.1.2 -o .nix/bun.nix
          sha256sum bun.lock | cut -d' ' -f1 > .nix/bun-lock-hash
          bun install --frozen-lockfile
          bunx prettier --write scripts/check-nix-deps.ts .github/workflows/nix-check.yml
          bun run build > "$RUNNER_TEMP/nix-repair/frontend.log" 2>&1
          bun run lint >> "$RUNNER_TEMP/nix-repair/frontend.log" 2>&1
          git diff --check
          git config user.name 'Sergey Morozov'
          git config user.email 'tr0st@bk.ru'
          git add flake.nix flake.lock .nix/bun.nix .nix/bun-lock-hash scripts/check-nix-deps.ts .github/workflows/nix-check.yml
          git commit -m 'fix(nix): update bun2nix and pin the matching dependency generator'
          git push origin HEAD:refs/heads/work/nix-updated-candidate-2026-09-08
          git rev-parse HEAD | tee "$RUNNER_TEMP/nix-repair/candidate-sha.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/nix-repair/candidate-tree.txt"
          git branch candidate-export HEAD
          git bundle create "$RUNNER_TEMP/nix-repair/source.bundle" candidate-export
          cp flake.lock "$RUNNER_TEMP/nix-repair/flake.lock"
      - name: Evaluate both supported platforms
        run: |
          set -euo pipefail
          nix eval --raw .#packages.x86_64-linux.handy.drvPath 2>&1 | tee "$RUNNER_TEMP/nix-repair/eval-x86_64.log"
          nix eval --raw .#packages.aarch64-linux.handy.drvPath 2>&1 | tee "$RUNNER_TEMP/nix-repair/eval-aarch64.log"
          nix eval --json .#devShells.x86_64-linux.default.buildInputs --apply 'xs: map (x: x.name) xs' 2>&1 | tee "$RUNNER_TEMP/nix-repair/dev-tools.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-repair-source
          path: ${{ runner.temp }}/nix-repair/
          retention-days: 3
      - name: Build the actual Nix package
        run: |
          set -euo pipefail
          nix build .#handy -L --show-trace > "$RUNNER_TEMP/nix-repair/build.log" 2>&1 &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 20
            tail -5 "$RUNNER_TEMP/nix-repair/build.log"
          done
          status=0
          wait "$pid" || status=$?
          tail -100 "$RUNNER_TEMP/nix-repair/build.log"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          test -x result/bin/handy
          readlink -f result | tee "$RUNNER_TEMP/nix-repair/result.txt"
          result/bin/handy --help > "$RUNNER_TEMP/nix-repair/help.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-repair-build-results
          path: ${{ runner.temp }}/nix-repair/
          retention-days: 3
