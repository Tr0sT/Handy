name: "Fork regression tests"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/fork-regressions.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      - ".github/workflows/fork-regressions.yml"

permissions:
  contents: read

concurrency:
  group: fork-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression-tests:
    if: github.repository == 'Tr0sT/Handy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # CPU-only native libraries keep these logic tests independent of GPU hardware.
      TRANSCRIBE_CMAKE_ARGS: "-DTRANSCRIBE_VULKAN=OFF -DGGML_CPU_ALL_VARIANTS=OFF"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell-dev libvulkan-dev glslc spirv-headers glslang-tools xvfb
          mkdir -p src-tauri/resources/models
          curl -fL --retry 2 -o src-tauri/resources/models/silero_vad_v4.onnx https://blob.handy.computer/silero_vad_v4.onnx
          curl -fL --retry 2 -o /tmp/ort.tgz https://blob.handy.computer/onnxruntime-linux-x86_64-1.24.2.tgz
          tar -xzf /tmp/ort.tgz -C /tmp
          echo 'ORT_LIB_LOCATION=/tmp/onnxruntime-linux-x86_64-1.24.2/lib' >> "$GITHUB_ENV"
          echo 'ORT_PREFER_DYNAMIC_LINK=1' >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/onnxruntime-linux-x86_64-1.24.2/lib:$PWD/src-tauri/target/debug" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: handy-regressions-cpu-v1-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Frontend build and checks
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run lint
          bun run check:translations
          bun run check:model-languages
          bun run format:check
      - name: Rust compilation and lint checks
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --locked --tests
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --tests
      - name: Native Rust regression suite
        run: xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --locked --lib
