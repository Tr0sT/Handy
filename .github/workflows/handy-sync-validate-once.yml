name: "Handy sync candidate regression + Nix validation (temporary)"
on:
  push:
    branches:
      - work/handy-sync-2026-10-30-run

permissions:
  contents: read

jobs:
  regression-tests:
    if: github.repository == 'Tr0sT/Handy'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # CPU-only native libraries keep these logic tests independent of GPU hardware.
      TRANSCRIBE_CMAKE_ARGS: "-DTRANSCRIBE_VULKAN=OFF -DGGML_CPU_ALL_VARIANTS=OFF"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: work/handy-sync-candidate-2026-10-30
      - uses: oven-sh/setup-bun@v2
      - name: Install Linux build prerequisites
        run: |
          set -euo pipefail
          mkdir -p /tmp/handy-regressions
          sudo apt-get update -qq
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libopenblas-dev libx11-dev libxtst-dev libxrandr-dev libgtk-layer-shell-dev libvulkan-dev glslc spirv-headers glslang-tools xvfb
          mkdir -p src-tauri/resources/models
          test -s src-tauri/resources/models/silero-vad-v6.2-F32.gguf
          curl -fL --retry 2 -o /tmp/ort.tgz https://blob.handy.computer/onnxruntime-linux-x86_64-1.24.2.tgz
          tar -xzf /tmp/ort.tgz -C /tmp
          echo 'ORT_LIB_LOCATION=/tmp/onnxruntime-linux-x86_64-1.24.2/lib' >> "$GITHUB_ENV"
          echo 'ORT_PREFER_DYNAMIC_LINK=1' >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/tmp/onnxruntime-linux-x86_64-1.24.2/lib:$PWD/src-tauri/target/debug" >> "$GITHUB_ENV"
      - name: Identify Rust toolchain
        id: rust-toolchain
        run: echo "identity=$(rustc -vV | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: handy-regressions-cpu-v3-${{ steps.rust-toolchain.outputs.identity }}-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: handy-regressions-cpu-v3-${{ steps.rust-toolchain.outputs.identity }}-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Frontend build and checks
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          { bun run build; bun run lint; bun run check:translations; bun run check:model-languages; bun run format:check; } 2>&1 | tee /tmp/handy-regressions/frontend.log
      - name: Rust compilation and lint checks
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --locked --tests 2>&1 | tee /tmp/handy-regressions/check.log
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --tests 2>&1 | tee /tmp/handy-regressions/clippy.log
      - name: Native Rust regression suite
        run: |
          set -euo pipefail
          xvfb-run -a cargo test --manifest-path src-tauri/Cargo.toml --locked --lib 2>&1 | tee /tmp/handy-regressions/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fork-regression-results
          path: /tmp/handy-regressions/
          if-no-files-found: ignore
          retention-days: 7
  nix-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: work/handy-sync-candidate-2026-10-30
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: handy-computer
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Check generated Nix dependencies
        run: |
          bunx bun2nix@2.1.2 -o .nix/bun.nix
          git diff --exit-code -- .nix/bun.nix
          test "$(sha256sum bun.lock | cut -d' ' -f1)" = "$(cat .nix/bun-lock-hash)"
      - name: Evaluate both Linux packages
        run: |
          nix eval --raw .#packages.x86_64-linux.handy.drvPath
          nix eval --raw .#packages.aarch64-linux.handy.drvPath
      - name: Build and smoke-test Handy
        shell: bash
        run: |
          set -euo pipefail
          nix build .#handy -L --show-trace 2>&1 | tee "$RUNNER_TEMP/handy-nix-build.log"
          test -x result/bin/handy
          result/bin/handy --help
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nix-build-log
          path: ${{ runner.temp }}/handy-nix-build.log
          if-no-files-found: ignore
          retention-days: 7

# Check candidate after restoring TypeScript language detection binding.
